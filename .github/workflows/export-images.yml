name: Export KiCad Images

on:
  push:
    branches: [main]
    paths:
      - 'kicad/**'
  workflow_dispatch:

concurrency:
  group: export-kicad-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  export:
    uses: zeulewan/shared-workflows/.github/workflows/export-kicad-images.yml@main
